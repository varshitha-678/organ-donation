<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | LifeLink</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">♥</span> LifeLink</a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav"><a href="index.html">Home</a><a href="awareness.html">Learn</a><a href="register.html">Express Interest</a><a class="active" href="login.html">Login</a></nav></header>
<main><section class="auth-wrap"><div class="section-heading"><p class="eyebrow">YOUR ACCOUNT</p><h1>Welcome back</h1><p>Log in or create an account for the project demo.</p></div><div class="panel auth-panel"><div class="tab-row"><button type="button" class="tab active" id="login-tab">Login</button><button type="button" class="tab" id="signup-tab">Create account</button></div>
<form id="auth-form"><div id="name-field" class="hidden"><label for="full-name">Display name</label><input id="full-name" autocomplete="name" maxlength="80" placeholder="Your name"></div><label for="auth-email">Email address</label><input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"><button class="button button-primary button-full" id="auth-submit" type="submit">Log in</button><p id="auth-message" class="form-message" role="status"></p></form><p class="small muted">Use a test email address you can access. Supabase may require email confirmation depending on your project settings.</p></div></section></main><footer class="footer"><p>LifeLink · Educational college project</p></footer><script type="module" src="js/auth.js"></script><script src="js/site.js"></script></body></html>
